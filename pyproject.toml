[project]
name = "campusreserve"
version = "0.2.1"
description = "A tested campus room and equipment reservation application"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Hamza Guelleh Ali"}]
dependencies = [
  "fastapi>=0.115,<1",
  "sqlmodel>=0.0.22,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
campusreserve = "campusreserve.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campusreserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
